<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title"><title id="title">導入：設定、拡張、ブリッジ、G2導入、最初の会話の5ステップ</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans",sans-serif;fill:#20302a} .muted{fill:#62736b} .title{font-size:24px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.mono{font-family:ui-monospace,monospace}.card{fill:#fff;stroke:#ccdbd2;stroke-width:2}.accent{fill:#166f50}</style><rect width="960" height="340" rx="20" fill="#f3f7f4"/><text x="32" y="44" class="title">初回だけ、5つのステップ</text><text x="32" y="73" class="body muted">Mac実行用セットなら、ソースのビルドは不要</text><rect x="24" y="105" width="174" height="158" rx="16" class="card"/><circle cx="51" cy="134" r="17" fill="#166f50"/><text x="46" y="140" style="fill:#fff;font-size:18px;font-weight:700">1</text><text x="38" y="178" style="font-size:18px;font-weight:700">ダウンロード</text><text x="38" y="207" class="small">自分の設定</text><text x="38" y="240" class="small mono accent">npm run setup</text><rect x="212" y="105" width="174" height="158" rx="16" class="card"/><circle cx="239" cy="134" r="17" fill="#166f50"/><text x="234" y="140" style="fill:#fff;font-size:18px;font-weight:700">2</text><text x="226" y="178" style="font-size:18px;font-weight:700">Chrome拡張</text><text x="226" y="207" class="small">build/extension を選ぶ</text><text x="226" y="240" class="small mono accent">chrome:install</text><rect x="400" y="105" width="174" height="158" rx="16" class="card"/><circle cx="427" cy="134" r="17" fill="#166f50"/><text x="422" y="140" style="fill:#fff;font-size:18px;font-weight:700">3</text><text x="414" y="178" style="font-size:18px;font-weight:700">ブリッジ起動</text><text x="414" y="207" class="small">診断がOKになる</text><text x="414" y="240" class="small mono accent">services:start</text><rect x="588" y="105" width="174" height="158" rx="16" class="card"/><circle cx="615" cy="134" r="17" fill="#166f50"/><text x="610" y="140" style="fill:#fff;font-size:18px;font-weight:700">4</text><text x="602" y="178" style="font-size:18px;font-weight:700">G2へ導入</text><text x="602" y="207" class="small">作成 → Even Hub</text><text x="602" y="240" class="small mono accent">pack:g2</text><rect x="776" y="105" width="174" height="158" rx="16" class="card"/><circle cx="803" cy="134" r="17" fill="#166f50"/><text x="798" y="140" style="fill:#fff;font-size:18px;font-weight:700">5</text><text x="790" y="178" style="font-size:18px;font-weight:700">最初の会話</text><text x="790" y="207" class="small">長押しで話す</text><text x="790" y="240" class="small mono accent">REC → ASR → DOT</text><text x="32" y="307" class="small muted">設定は自分のMacで生成。次回からはMacとChromeを起動し、Even Appで開くだけ。</text></svg>
